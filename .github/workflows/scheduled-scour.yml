name: TalentScout Scheduled Scour & Email Digest

# Runs 3x daily aligned with Pacific Standard Time (UTC-8), scheduled on an
# off-peak minute (:47) rather than :00 to avoid GitHub Actions top-of-the-hour
# cron queue congestion and dropped triggers:
#   - ~06:47–07:00 PST (07:47–08:00 PDT) -> 14:47 UTC
#   - ~12:47–13:00 PST (13:47–14:00 PDT) -> 20:47 UTC
#   - ~20:47–21:00 PST (21:47–22:00 PDT) -> 04:47 UTC (next UTC day)
#
# Note: GitHub Actions only executes `schedule` triggers from the repository's
# default branch (`main`) and automatically pauses cron schedules after 60 days
# of repository inactivity.
on:
  schedule:
    - cron: '47 14 * * *'
    - cron: '47 20 * * *'
    - cron: '47 4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Crawler scope mode'
        required: true
        default: 'fast'
        type: choice
        options:
          - fast
          - ats-only
          - full
      time_budget:
        description: 'Soft time budget per profile in minutes (0 = unlimited)'
        required: false
        default: '20'
        type: string
      dry_run:
        description: 'Dry run (do not persist DB cache or send emails)'
        required: false
        default: false
        type: boolean
      send_email:
        description: 'Send SMTP digest emails after packaging'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: talentscout-scheduled-scour
  cancel-in-progress: false

jobs:
  scour-and-deliver:
    name: Scour, Package & Deliver
    # Pin to ubuntu-24.04 so Playwright's nativeDeps map cleanly (libasound2t64)
    # without breaking when ubuntu-latest advances to a newer Ubuntu LTS.
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      PYTHONUNBUFFERED: '1'
      # Secrets (configure under Settings -> Secrets and variables -> Actions)
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
      RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
      DELIVERY_MIN_SCORE: ${{ secrets.DELIVERY_MIN_SCORE }}
      DELIVERY_MAX_JOBS: ${{ secrets.DELIVERY_MAX_JOBS }}
      TALENTSCOUT_PROFILES_JSON: ${{ secrets.TALENTSCOUT_PROFILES_JSON }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium (fast / full modes)
        if: ${{ inputs.mode != 'ats-only' }}
        run: |
          playwright install chromium --with-deps

      - name: Restore deduplication SQLite state from GitHub Actions Cache
        id: restore-db
        uses: actions/cache/restore@v4
        with:
          path: job_tracker.db
          key: talentscout-db-${{ github.run_id }}
          restore-keys: |
            talentscout-db-

      - name: Bootstrap SQLite & sync secret profiles
        run: |
          python scripts/ci_bootstrap.py

      - name: Run scheduled crawl per profile
        shell: bash
        run: |
          MODE="${{ inputs.mode }}"
          MODE="${MODE:-fast}"
          BUDGET="${{ inputs.time_budget }}"
          BUDGET="${BUDGET:-20}"
          DRY_RUN="${{ inputs.dry_run }}"
          DRY_RUN="${DRY_RUN:-false}"

          PROFILE_IDS=$(python scripts/ci_bootstrap.py --list-profile-ids)
          echo "[*] Target profile IDs: ${PROFILE_IDS}"

          for PID in ${PROFILE_IDS}; do
            echo "========================================"
            echo "[*] Crawling for profile ID: ${PID} (mode=${MODE}, budget=${BUDGET}m)"
            echo "========================================"

            if [ "${DRY_RUN}" = "true" ]; then
              python scripts/ingest_dreamwork.py --profile-id "${PID}" --days 2 --limit 25 --no-md --dry-run || echo "[!] DreamworkHQ ingestor returned non-zero (continuing)"
              python scripts/auto_scour.py --profile "${PID}" --mode "${MODE}" --time-budget "${BUDGET}" --dry-run
            else
              python scripts/ingest_dreamwork.py --profile-id "${PID}" --days 2 --limit 25 --no-md || echo "[!] DreamworkHQ ingestor returned non-zero (continuing)"
              python scripts/auto_scour.py --profile "${PID}" --mode "${MODE}" --time-budget "${BUDGET}"
            fi
          done

      - name: Package new delta roles & send SMTP email digest
        shell: bash
        run: |
          DRY_RUN="${{ inputs.dry_run }}"
          DRY_RUN="${DRY_RUN:-false}"
          SEND_EMAIL="${{ inputs.send_email }}"
          SEND_EMAIL="${SEND_EMAIL:-true}"

          ARGS=(--run-id "${GITHUB_RUN_ID}" --out-dir "logs/packages")
          if [ "${DRY_RUN}" = "true" ]; then
            ARGS+=(--dry-run)
          elif [ "${SEND_EMAIL}" != "true" ]; then
            ARGS+=(--skip-email)
          fi

          python scripts/package_and_email.py "${ARGS[@]}"

      - name: Checkpoint SQLite WAL before cache save
        if: always()
        run: |
          python -c "import os, sqlite3
          if os.path.exists('job_tracker.db'):
              conn = sqlite3.connect('job_tracker.db')
              conn.execute('PRAGMA wal_checkpoint(TRUNCATE)')
              conn.close()
              print('[*] SQLite WAL checkpoint complete.')"

      - name: Save updated deduplication SQLite state to GitHub Actions Cache
        if: ${{ always() && inputs.dry_run != true }}
        uses: actions/cache/save@v4
        with:
          path: job_tracker.db
          key: talentscout-db-${{ github.run_id }}

      - name: Upload non-PII crawl telemetry artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scour-telemetry-${{ github.run_id }}
          path: logs/scour_summary_latest.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Write run summary (privacy-safe)
        if: always()
        shell: bash
        run: |
          {
            echo "## TalentScout Scheduled Run Summary"
            echo "- **Run ID:** \`${GITHUB_RUN_ID}\`"
            echo "- **Trigger:** \`${GITHUB_EVENT_NAME}\`"
            echo "- **Mode:** \`${{ inputs.mode || 'fast' }}\`"
            echo "- **Cache Restored:** \`${{ steps.restore-db.outputs.cache-hit || 'false' }}\`"
            echo "- **Dry Run:** \`${{ inputs.dry_run || 'false' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
